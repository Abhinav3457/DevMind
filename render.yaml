# DevMind AI - Backend API Deployment
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: devmind-ai-api
    runtime: node
    repo: https://github.com/Abhinav3457/DevMind
    region: oregon
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    numInstances: 1

    envVars:
      # ──────────────────────────────
      # App Configuration
      # ──────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        sync: false # Set to frontend URL after deploy
      - key: SOCKET_CORS_ORIGIN
        sync: false # Set to frontend URL after deploy

      # ──────────────────────────────
      # MongoDB (use MongoDB Atlas)
      # ──────────────────────────────
      - key: MONGODB_URI
        sync: false

      # ──────────────────────────────
      # JWT Authentication
      # ──────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # ──────────────────────────────
      # Cloudinary (file uploads)
      # ──────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ──────────────────────────────
      # SMTP / Email (Nodemailer)
      # ──────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # ──────────────────────────────
      # AI APIs
      # ──────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # ──────────────────────────────
      # GitHub Integration
      # ──────────────────────────────
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # Frontend Static Site
  - type: web
    name: devmind-ai-frontend
    runtime: static
    repo: https://github.com/Abhinav3457/DevMind
    region: oregon
    branch: main
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_URL
        value: https://devmind-backend-26uw.onrender.com/api/v1
